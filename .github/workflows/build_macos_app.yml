name: Build macOS app (unsigned)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build_macos:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      - name: Use newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Read Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\(.*\)".*/\1/p' .fvmrc)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        working-directory: packages/localsend_isolates
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS app
        working-directory: app
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ""
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Sign locally and zip
        working-directory: app/build/macos/Build/Products/Release
        run: |
          ls
          codesign --force --deep --preserve-metadata=entitlements --sign - "Lalitha Local Share.app"
          ditto -c -k --keepParent "Lalitha Local Share.app" "$GITHUB_WORKSPACE/Lalitha-Local-Share-macOS.zip"

      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: Lalitha-Local-Share-macOS
          path: Lalitha-Local-Share-macOS.zip

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp "$RUNNER_TEMP/build.log" /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/build.log
          grep -n -i "error" /tmp/logs/build.log | head -100 > /tmp/logs/errors.txt || true
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/logs/* .
          git add -A && git commit -m "macOS build log" && git push -f origin build-logs
