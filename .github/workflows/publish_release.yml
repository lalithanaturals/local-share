name: Publish release from builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.18.2"
        required: true
      mac_run:
        description: "Run ID of a successful 'Build macOS app (unsigned)'"
        required: true
      windows_run:
        description: "Run ID of a successful 'Build windows exe (unsigned)'"
        required: true
      android_run:
        description: "Run ID of a successful 'Build Android APK'"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.mac_run }}
          github-token: ${{ github.token }}
          path: dl/mac
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
          path: dl/windows
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.android_run }}
          github-token: ${{ github.token }}
          path: dl/android

      - name: Collect files
        run: |
          find dl -type f
          mkdir out
          cp "$(find dl/mac -name '*.zip' | head -1)" "out/Lalitha-Local-Share-Mac.zip"
          cp "$(find dl/windows -name '*.exe' | head -1)" "out/Lalitha-Local-Share-Windows-Setup.exe"
          cp "$(find dl/android -name '*arm64-v8a*.apk' | head -1)" "out/Lalitha-Local-Share-Android.apk"
          cp "$(find dl/android -name '*armeabi-v7a*.apk' | head -1)" "out/Lalitha-Local-Share-Android-older-phones.apk" || true
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download Lalitha Local Share

          | Device | File |
          |---|---|
          | **Windows** | `Lalitha-Local-Share-Windows-Setup.exe` |
          | **Mac** | `Lalitha-Local-Share-Mac.zip` |
          | **Android** | `Lalitha-Local-Share-Android.apk` (use the "older-phones" file only if this one won't install) |
          | **iPhone** | No app needed: tap **Show QR** on your computer and scan it with the iPhone camera |

          These builds are not signed with a paid developer certificate, so Windows and Mac show a one-time warning:
          - **Windows:** click *More info → Run anyway*.
          - **Mac:** unzip, move to Applications, open it, then *System Settings → Privacy & Security → Open Anyway*.
          - **Android:** allow *Install unknown apps* when asked.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "${{ inputs.tag }}" out/* --title "Lalitha Local Share ${{ inputs.tag }}" --notes-file notes.md --target "${{ github.sha }}"
