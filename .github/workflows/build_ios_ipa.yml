name: Build iOS IPA (unsigned, for sideloading)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach the IPA to this release (e.g. v1.18.2). Leave empty to skip."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build_ios:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Read Flutter version
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/.*"flutter": "\(.*\)".*/\1/p' .fvmrc)" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        working-directory: packages/localsend_isolates
        run: |
          rustup show
          rustup target add aarch64-apple-ios

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS app (no code signing)
        working-directory: app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package IPA
        working-directory: app/build/ios/iphoneos
        run: |
          ls
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Lalitha-Local-Share-iPhone.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/Lalitha-Local-Share-iPhone.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: Lalitha-Local-Share-iPhone
          path: Lalitha-Local-Share-iPhone.ipa

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" Lalitha-Local-Share-iPhone.ipa --clobber

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp "$RUNNER_TEMP/build.log" /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/build.log
          grep -n -i "error" /tmp/logs/build.log | head -100 > /tmp/logs/errors.txt || true
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/logs/* .
          git add -A && git commit -m "iOS build log" && git push -f origin build-logs
